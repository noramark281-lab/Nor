plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace = "com.nor.mexc_event_trader"
    compileSdk = 35
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId = "com.nor.mexc_event_trader"
        minSdk = 21
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            def storeFileName = keystoreProperties.getProperty('storeFile')
            def keyStoreFile = null
            if (storeFileName) {
                if (file(storeFileName).exists()) {
                    keyStoreFile = file(storeFileName)
                } else if (file("app/${storeFileName}").exists()) {
                    keyStoreFile = file("app/${storeFileName}")
                } else if (rootProject.file(storeFileName).exists()) {
                    keyStoreFile = rootProject.file(storeFileName)
                } else if (rootProject.file("app/${storeFileName}").exists()) {
                    keyStoreFile = rootProject.file("app/${storeFileName}")
                }
            }
            if (keyStoreFile != null && keyStoreFile.exists()) {
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
                storeFile keyStoreFile
                storePassword keystoreProperties.getProperty('storePassword')
                v1SigningEnabled true
                v2SigningEnabled true
            } else {
                keyAlias 'androiddebugkey'
                keyPassword 'android'
                storeFile file("${System.properties['user.home']}/.android/debug.keystore")
                storePassword 'android'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
    }
}
