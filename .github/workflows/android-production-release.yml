name: Android Production Release

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-production-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    name: Verify, Sign, and Publish Android Release
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate Flutter source
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos
          if [ -d test ]; then
            flutter test
          else
            echo 'No Flutter test directory is present; source analysis completed.'
          fi

      - name: Restore fixed release-signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Missing required signing secret: $secret_name" >&2
              exit 1
            fi
          done

          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-upload.jks
          keytool -list \
            -keystore android/app/release-upload.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            > /dev/null

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/release-upload.jks
          EOF

      - name: Build signed APK and AAB
        run: |
          set -euo pipefail
          flutter build apk --release --no-tree-shake-icons
          flutter build appbundle --release --no-tree-shake-icons

      - name: Verify signed Android artifacts
        id: artifacts
        run: |
          set -euo pipefail
          VERSION=$(awk -F ': ' '/^version:/{print $2}' pubspec.yaml | cut -d '+' -f 1)
          APK_SOURCE=build/app/outputs/flutter-apk/app-release.apk
          AAB_SOURCE=build/app/outputs/bundle/release/app-release.aab
          test -s "$APK_SOURCE"
          test -s "$AAB_SOURCE"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK_SOURCE"
          mkdir -p release-assets
          cp "$APK_SOURCE" "release-assets/Nor-MEXC-Trader-${VERSION}.apk"
          cp "$AAB_SOURCE" "release-assets/Nor-MEXC-Trader-${VERSION}.aab"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nor-MEXC-Trader-APK-${{ steps.artifacts.outputs.version }}
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload AAB build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nor-MEXC-Trader-AAB-${{ steps.artifacts.outputs.version }}
          path: release-assets/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.artifacts.outputs.version }}-build-${{ github.run_number }}
          name: Nor MEXC Trader v${{ steps.artifacts.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.apk
            release-assets/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
