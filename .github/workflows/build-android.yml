name: Build Signed Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate / Ensure Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type all
          chmod +x ./gradlew

      - name: Prepare Keystore & Signing Configuration
        run: |
          mkdir -p app
          
          KEYSTORE_VALID=false
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding KEYSTORE_BASE64..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore 2>/dev/null || rm -f app/release.keystore
          elif [ -n "${{ secrets.CM_KEYSTORE }}" ]; then
            echo "Decoding CM_KEYSTORE..."
            echo "${{ secrets.CM_KEYSTORE }}" | base64 --decode > app/release.keystore 2>/dev/null || rm -f app/release.keystore
          fi

          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          [ -z "$STORE_PASS" ] && STORE_PASS="${{ secrets.CM_KEYSTORE_PASSWORD }}"

          ALIAS="${{ secrets.KEY_ALIAS }}"
          [ -z "$ALIAS" ] && ALIAS="${{ secrets.CM_KEY_ALIAS }}"

          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          [ -z "$KEY_PASS" ] && KEY_PASS="$STORE_PASS"

          if [ -f app/release.keystore ] && [ -n "$STORE_PASS" ] && [ -n "$ALIAS" ]; then
            if keytool -list -keystore app/release.keystore -storepass "$STORE_PASS" -alias "$ALIAS" > /dev/null 2>&1; then
              echo "✅ Keystore is valid and verified."
              KEYSTORE_VALID=true
            else
              echo "⚠️ Keystore verification failed. Generating fallback release keystore for CI."
              rm -f app/release.keystore
            fi
          fi

          if [ "$KEYSTORE_VALID" = true ]; then
            echo "storeFile=release.keystore" > key.properties
            echo "storePassword=$STORE_PASS" >> key.properties
            echo "keyAlias=$ALIAS" >> key.properties
            echo "keyPassword=$KEY_PASS" >> key.properties
          else
            echo "Generating release signing keystore..."
            rm -f app/release.keystore
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -storepass androidci \
              -keypass androidci \
              -alias release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CI,O=MariaBot,L=City,ST=State,C=US"
            echo "storeFile=release.keystore" > key.properties
            echo "storePassword=androidci" >> key.properties
            echo "keyAlias=release" >> key.properties
            echo "keyPassword=androidci" >> key.properties
          fi

      - name: Build Signed Release APK
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_SECRET_KEY: ${{ secrets.MEXC_SECRET_KEY }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

