name: Build Signed APK & AAB Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Keystore & Signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ]; then
            echo "✅ Using configured GitHub Secret Keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
          else
            echo "⚡ Generating release signing key..."
            keytool -genkey -v -keystore android/app/upload-keystore.jks -alias mexckey -keyalg RSA -keysize 2048 -validity 10000 -storepass mexcpass123 -keypass mexcpass123 -dname "CN=Nor, OU=Trading, O=NorLab, L=Dubai, S=Dubai, C=AE"
            cat > android/key.properties <<EOF
          storePassword=mexcpass123
          keyPassword=mexcpass123
          keyAlias=mexckey
          storeFile=upload-keystore.jks
          EOF
          fi
          ls -la android/app/upload-keystore.jks

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --dart-define=MEXC_API_KEY="${{ secrets.MEXC_API_KEY || secrets.API_KEY }}" --dart-define=MEXC_SECRET_KEY="${{ secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}" --dart-define=MEXC_API_SECRET="${{ secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}" --dart-define=SERVER_IP="${{ secrets.SERVER_IP || secrets.HOST_IP }}"
        timeout-minutes: 15

      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release --no-tree-shake-icons --dart-define=MEXC_API_KEY="${{ secrets.MEXC_API_KEY || secrets.API_KEY }}" --dart-define=MEXC_SECRET_KEY="${{ secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}" --dart-define=MEXC_API_SECRET="${{ secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}" --dart-define=SERVER_IP="${{ secrets.SERVER_IP || secrets.HOST_IP }}"
        timeout-minutes: 15

      - name: Verify APK & AAB exist
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found at $APK_PATH"
            exit 1
          fi
          if [ ! -f "$AAB_PATH" ]; then
            echo "❌ AAB not found at $AAB_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH" "$AAB_PATH"
          echo "✅ APK built: $(du -h $APK_PATH | cut -f1)"
          echo "✅ AAB built: $(du -h $AAB_PATH | cut -f1)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mexc-spot-trader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mexc-spot-trader-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create GitHub Release & Upload APK
        id: create_release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "MEXC Spot Trader v${{ github.run_number }}"
          body: |
            🚀 إصدار تلقائي لتطبيق MEXC Spot Trader
            - ✅ بناء مستقر (Stable Build)
            - ✅ توقيع رقمي (Signed APK & AAB)
            - ✅ جاهز للتثبيت على Android 5.0+ (API 21)
            - ✅ AAB جاهز للرفع على Google Play
            - ✅ رابط التحميل المباشر في الأسفل
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print download link
        if: steps.create_release.outcome == 'success'
        run: |
          echo ""
          echo "========================================"
          echo "🎉 BUILD SUCCESSFUL!"
          echo "========================================"
          echo "📦 Release URL: https://github.com/${{ github.repository }}/releases/tag/v${{ github.run_number }}"
          echo "📥 Direct APK: https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/app-release.apk"
          echo "📥 Direct AAB: https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/app-release.aab"
          echo "========================================"
