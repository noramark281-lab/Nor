name: Build & Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      mexc_api_key:
        description: 'MEXC API Key (optional, overrides repository secret)'
        required: false
        type: string
      mexc_secret_key:
        description: 'MEXC Secret Key (optional, overrides repository secret)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Determine API credentials
        id: creds
        run: |
          API_KEY="${{ inputs.mexc_api_key || secrets.MEXC_API_KEY }}"
          SECRET_KEY="${{ inputs.mexc_secret_key || secrets.MEXC_SECRET_KEY }}"
          echo "Using API key length: ${#API_KEY}"
          echo "Using secret key length: ${#SECRET_KEY}"
          echo "api_key=$API_KEY" >> "$GITHUB_OUTPUT"
          echo "secret_key=$SECRET_KEY" >> "$GITHUB_OUTPUT"

      - name: Build APK with credentials
        run: |
          flutter build apk --release \
            --dart-define=MEXC_API_KEY="${{ steps.creds.outputs.api_key }}" \
            --dart-define=MEXC_SECRET_KEY="${{ steps.creds.outputs.secret_key }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          TAG="v${{ github.run_number }}.${{ github.run_attempt }}"
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "Release $TAG" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
