name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Keystore Password'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Frontend Assets
        run: npm run build

      - name: Add and Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Setup Keystore
        run: |
          echo "Setting up keystore..."
          ls -la android/app/

      - name: Build Android Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || github.event.inputs.keystore_password }}
        run: |
          cd android
          chmod +x gradlew
          export KEY_ALIAS=upload
          export KEYSTORE_PATH=app/upload-keystore.jks
          ./gradlew assembleRelease --stacktrace

      - name: Build Android Signed Release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || github.event.inputs.keystore_password }}
        run: |
          cd android
          chmod +x gradlew
          export KEY_ALIAS=upload
          export KEYSTORE_PATH=app/upload-keystore.jks
          ./gradlew bundleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEXC-Trading-Bot-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEXC-Trading-Bot-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create or Update GitHub Release & Upload APK / AAB
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || github.event.inputs.keystore_password }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          APK="android/app/build/outputs/apk/release/app-release.apk#MEXC-Trading-Bot-${TAG}-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab#MEXC-Trading-Bot-${TAG}-release.aab"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading assets with clobber..."
            gh release upload "$TAG" "$APK" "$AAB" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$APK" "$AAB" \
              --title "MEXC Trading Bot Release $TAG" \
              --notes "🚀 **MEXC Trading Bot Android Release $TAG**

          ### 📱 روابط التحميل المباشرة
          - **ملف APK (تثبيت مباشر)**: \`MEXC-Trading-Bot-${TAG}-release.apk\`
          - **حزمة AAB (جوجل بلاي)**: \`MEXC-Trading-Bot-${TAG}-release.aab\`"
          fi
