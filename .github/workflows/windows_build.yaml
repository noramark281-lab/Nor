name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'lib/**'
      - 'windows/**'
      - '.github/workflows/windows_build.yaml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_GENERATOR_PLATFORM: x64
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify checkout
        shell: pwsh
        run: |
          Write-Host "Expected: $env:GITHUB_SHA"
          Write-Host "Actual:   $(git rev-parse HEAD)"
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch' }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Configure Windows toolchain
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v

      - name: Install dependencies
        shell: pwsh
        run: |
          flutter clean
          flutter pub get

      - name: Analyze project
        shell: pwsh
        run: flutter analyze --no-fatal-warnings

      - name: Build Windows release
        shell: pwsh
        env:
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY || secrets.API_KEY }}
          MEXC_SECRET_KEY: ${{ secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP || secrets.HOST_IP }}
        run: |
          flutter build windows --release --verbose `
            --dart-define=MEXC_API_KEY="$env:MEXC_API_KEY" `
            --dart-define=MEXC_SECRET_KEY="$env:MEXC_SECRET_KEY" `
            --dart-define=MEXC_API_SECRET="$env:MEXC_SECRET_KEY" `
            --dart-define=SERVER_IP="$env:SERVER_IP"

      - name: Verify exact executable
        shell: pwsh
        run: |
          $buildDir = 'build\windows\x64\runner\Release'
          $expected = Join-Path $buildDir 'mexc_event_trader_app.exe'
          if (!(Test-Path $expected)) {
            Get-ChildItem -Recurse 'build\windows' | ForEach-Object { Write-Host $_.FullName }
            throw "Expected executable not found: $expected"
          }
          Copy-Item $expected (Join-Path $buildDir 'Nor.exe') -Force
          Get-ChildItem $buildDir | Format-Table Name,Length

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $makensis = @(
            'C:\Program Files (x86)\NSIS\makensis.exe',
            'C:\Program Files\NSIS\makensis.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$makensis) { throw 'NSIS makensis.exe was not found on the runner' }
          & $makensis 'windows\installer.nsi'
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed with exit code $LASTEXITCODE" }
          if (!(Test-Path 'Nor_Setup.exe')) { throw 'Nor_Setup.exe was not generated' }

      - name: Package portable Windows build
        shell: pwsh
        run: |
          $buildDir = 'build\windows\x64\runner\Release'
          Compress-Archive -Path "$buildDir\*" -DestinationPath 'Nor-Windows-x64.zip' -Force
          if (!(Test-Path 'Nor-Windows-x64.zip')) { throw 'ZIP was not generated' }
          Get-FileHash 'Nor_Setup.exe','Nor-Windows-x64.zip' -Algorithm SHA256 | Format-Table

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nor-Windows-x64
          if-no-files-found: error
          path: |
            Nor_Setup.exe
            Nor-Windows-x64.zip
          retention-days: 90

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: windows-${{ github.run_number }}
          name: Nor Windows Build #${{ github.run_number }}
          generate_release_notes: true
          files: |
            Nor_Setup.exe
            Nor-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
