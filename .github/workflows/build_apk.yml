name: Build & Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_notes:
        description: 'Build notes (optional)'
        required: false
        type: string

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Verify API secrets exist
        id: creds
        run: |
          API_KEY="${MEXC_API_KEY}"
          SECRET_KEY="${MEXC_SECRET_KEY}"

          if [ -z "$API_KEY" ]; then
            echo "❌ Error: MEXC_API_KEY repository secret is not set."
            echo "Please add it at: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

          if [ -z "$SECRET_KEY" ]; then
            echo "❌ Error: MEXC_SECRET_KEY repository secret is not set."
            echo "Please add it at: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

          echo "✅ API credentials verified (key length: ${#API_KEY}, secret length: ${#SECRET_KEY})"
        env:
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_SECRET_KEY: ${{ secrets.MEXC_SECRET_KEY }}

      - name: Build APK with --dart-define secrets
        run: |
          flutter build apk --release \
            --dart-define=MEXC_API_KEY="${MEXC_API_KEY}" \
            --dart-define=MEXC_SECRET_KEY="${MEXC_SECRET_KEY}"
        env:
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_SECRET_KEY: ${{ secrets.MEXC_SECRET_KEY }}

      - name: Verify APK exists
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "❌ APK not found at $APK"
            ls -R build/app/outputs/ || true
            exit 1
          fi
          SIZE=$(du -h "$APK" | cut -f1)
          echo "✅ APK built successfully: $SIZE"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          TAG="v${{ github.run_number }}.${{ github.run_attempt }}"
          echo "Creating release $TAG"
          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "MEXC Event Trader $TAG" \
            --generate-notes \
            --notes "$(cat <<'EOF'
          ### ⚠️ Security Warning / تنبيه أمان
          This APK is built with embedded API keys. Use it only on your own device.
          هذا APK مبني بمفاتيح API مضمنة. استخدمه على جهازك الخاص فقط.
          EOF
          )"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
