name: Automated Build & Deployment Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type (release, beta, nightly)'
        required: false
        default: 'release'
      notify_deployment:
        description: 'Output Detailed Deployment Logs'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read
  deployments: write
  statuses: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Build Web Applet & Client Application
  # -------------------------------------------------------------
  build-web:
    name: Build Web Applet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build
        env:
          VITE_MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          VITE_MEXC_SECRET_KEY: ${{ secrets.MEXC_SECRET_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}

      - name: Verify Web Build Artifacts
        run: |
          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            echo "✅ Web build successfully verified in dist/"
            ls -lh dist/
          else
            echo "❌ Web build failed - dist/ or dist/index.html not found!"
            exit 1
          fi

      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-artifact
          path: dist/
          retention-days: 14

  # -------------------------------------------------------------
  # Job 2: Build Flutter Mobile Android (APK & AAB)
  # -------------------------------------------------------------
  build-mobile:
    name: Build Flutter Android (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Configure Keystore & Signing
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ]; then
            echo "🔑 Decoding configured GitHub Secret Keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
          else
            echo "🔑 Generating release signing keystore..."
            keytool -genkey -v -keystore android/app/upload-keystore.jks -alias mexckey -keyalg RSA -keysize 2048 -validity 10000 -storepass mexcpass123 -keypass mexcpass123 -dname "CN=Nor, OU=Trading, O=NorLab, L=Dubai, S=Dubai, C=AE"
            cat > android/key.properties <<EOF
          storePassword=mexcpass123
          keyPassword=mexcpass123
          keyAlias=mexckey
          storeFile=upload-keystore.jks
          EOF
          fi
          ls -la android/app/upload-keystore.jks

      - name: Build Release APK
        run: >-
          flutter build apk --release --no-tree-shake-icons
          --dart-define=MEXC_API_KEY="${{ secrets.MEXC_API_KEY }}"
          --dart-define=MEXC_SECRET_KEY="${{ secrets.MEXC_SECRET_KEY }}"
          --dart-define=SERVER_IP="${{ secrets.SERVER_IP }}"
        timeout-minutes: 20

      - name: Build Release App Bundle (AAB)
        run: >-
          flutter build appbundle --release --no-tree-shake-icons
          --dart-define=MEXC_API_KEY="${{ secrets.MEXC_API_KEY }}"
          --dart-define=MEXC_SECRET_KEY="${{ secrets.MEXC_SECRET_KEY }}"
          --dart-define=SERVER_IP="${{ secrets.SERVER_IP }}"
        timeout-minutes: 20

      - name: Verify APK & AAB Artifacts
        id: verify_artifacts
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found at $APK_PATH"
            exit 1
          fi
          if [ ! -f "$AAB_PATH" ]; then
            echo "❌ AAB not found at $AAB_PATH"
            exit 1
          fi
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          AAB_SIZE=$(du -h "$AAB_PATH" | cut -f1)
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "aab_size=$AAB_SIZE" >> $GITHUB_OUTPUT
          echo "✅ Verified APK: $APK_SIZE"
          echo "✅ Verified AAB: $AAB_SIZE"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mexc-trader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mexc-trader-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # -------------------------------------------------------------
  # Job 3: Release, Deployment Logs & Status Verification
  # -------------------------------------------------------------
  deploy-and-verify:
    name: Deploy Release & Verify Status
    needs: [build-web, build-mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: mexc-trader-apk
          path: release-artifacts/

      - name: Download AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: mexc-trader-aab
          path: release-artifacts/

      - name: Create GitHub Release
        id: create_release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Nor - MEXC Trader Release v${{ github.run_number }}"
          draft: false
          prerelease: false
          body: |
            ## 🚀 Nor - MEXC Trading & Event Contract Platform v${{ github.run_number }}
            
            ### 📦 Build & Release Summary
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Run Number**: `#${{ github.run_number }}`
            - **Status**: ✅ **SUCCESSFUL BUILD**
            
            ### 📱 Downloads
            - 📥 **APK (Direct Installation)**: [app-release.apk](https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/app-release.apk)
            - 📦 **AAB (Google Play Store)**: [app-release.aab](https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/app-release.aab)
            
            ### 🛡️ Features Included
            - Real-time MEXC Futures and Event Contract trading
            - Real wallet balance reading & automated trade execution
            - HMAC SHA-256 signed API security
            - Dedicated backend proxy integration via `SERVER_IP`
          files: |
            release-artifacts/app-release.apk
            release-artifacts/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output Deployment Logs & Summary Table
        run: |
          RELEASE_TAG="v${{ github.run_number }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          APK_DOWNLOAD="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/app-release.apk"
          AAB_DOWNLOAD="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/app-release.aab"
          WORKFLOW_RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "============================================================"
          echo "🎯 DEPLOYMENT STATUS VERIFICATION LOGS"
          echo "============================================================"
          echo "Timestamp:        $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Repository:       ${{ github.repository }}"
          echo "Commit SHA:       ${{ github.sha }}"
          echo "Branch:           ${{ github.ref_name }}"
          echo "Workflow Run:     ${WORKFLOW_RUN_URL}"
          echo "Deployment Tag:   ${RELEASE_TAG}"
          echo "Release Page:     ${RELEASE_URL}"
          echo "Direct APK URL:   ${APK_DOWNLOAD}"
          echo "Direct AAB URL:   ${AAB_DOWNLOAD}"
          echo "Status:           DEPLOYED & READY FOR PRODUCTION"
          echo "============================================================"

          # Output to GitHub Step Summary
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          # 🚀 Deployment Status: SUCCESS

          | Property | Value |
          | :--- | :--- |
          | **Status** | 🟢 **Deployed & Verified** |
          | **Version Tag** | \`${RELEASE_TAG}\` |
          | **Repository** | \`${{ github.repository }}\` |
          | **Commit** | \`${{ github.sha }}\` |
          | **Release Page** | [View GitHub Release](${RELEASE_URL}) |
          | **Direct APK Download** | [Download APK](${APK_DOWNLOAD}) |
          | **Direct AAB Download** | [Download AAB](${AAB_DOWNLOAD}) |
          | **Workflow Logs** | [View Run #${{ github.run_number }}](${WORKFLOW_RUN_URL}) |
          EOF
