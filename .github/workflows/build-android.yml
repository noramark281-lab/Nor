name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Keystore and key.properties
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
          else
            echo "Generating consistent release keystore for reproducible signing..."
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -storepass norpass123 \
              -keypass norpass123 \
              -alias nor_release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Nor,O=Nor,L=Nor,ST=Nor,C=US"
            cat > android/key.properties <<EOF
          storePassword=norpass123
          keyPassword=norpass123
          keyAlias=nor_release
          storeFile=upload-keystore.jks
          EOF
          fi
          ls -la android/app/upload-keystore.jks
          cat android/key.properties

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
        continue-on-error: true

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          echo "APK_PATH=$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nor-Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create Release and attach APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: android-v1.8.0-run${{ github.run_id }}
          name: Nor Android APK Release v1.8.0 (Run ${{ github.run_id }})
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            📱 Nor - MEXC Event Futures Trading App (Android APK)
            
            ✅ Release build verified and generated successfully.
            📦 Direct Download: [app-release.apk](https://github.com/${{ github.repository }}/releases/download/android-v1.8.0-run${{ github.run_id }}/app-release.apk)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
