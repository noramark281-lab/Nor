name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Frontend Assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.PROJECT_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.PUBLISHABLE_KEY }}
          VITE_MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          VITE_MEXC_SECRET_KEY: ${{ secrets.MEXC_SECRET_KEY }}

      - name: Add and Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Decode Keystore for Signed Release
        id: decode_keystore
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            mkdir -p android/app
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
            chmod 600 android/app/upload-keystore.jks
            if keytool -list -keystore android/app/upload-keystore.jks -storepass "${{ secrets.CM_KEYSTORE_PASSWORD }}" >/dev/null 2>&1; then
              echo "keystore_valid=true" >> $GITHUB_OUTPUT
              echo "✅ Keystore decoded and verified."
            else
              echo "keystore_valid=false" >> $GITHUB_OUTPUT
              echo "⚠️ Keystore decoded but password verification failed."
            fi
          else
            echo "keystore_valid=false" >> $GITHUB_OUTPUT
            echo "⚠️ No KEYSTORE_BASE64 secret found."
          fi

      - name: Build Android Signed Release APK
        id: build_signed
        if: steps.decode_keystore.outputs.keystore_valid == 'true'
        continue-on-error: true
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          CM_KEYSTORE_FILE: "upload-keystore.jks"
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}

      - name: Build Android Debug APK (Fallback)
        id: build_debug
        if: always() && (steps.decode_keystore.outputs.keystore_valid != 'true' || steps.build_signed.outcome == 'failure')
        run: |
          echo "🔄 Building Debug APK as fallback..."
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Signed APK Artifact
        if: steps.build_signed.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MEXC-Trading-Bot-APK-Signed
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Debug APK Artifact
        if: steps.build_debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MEXC-Trading-Bot-APK-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release (Signed)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.build_signed.outcome == 'success'
        run: |
          TAG="v1.0.${{ github.run_number }}"
          APK="android/app/build/outputs/apk/release/app-release.apk#MEXC-Trading-Bot-${TAG}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "MEXC Trading Bot Release $TAG" \
              --notes "🚀 **Signed Release APK** — MEXC Trading Bot $TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (Debug)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.build_debug.outcome == 'success' && steps.build_signed.outcome != 'success'
        run: |
          TAG="v1.0.${{ github.run_number }}-debug"
          APK="android/app/build/outputs/apk/debug/app-debug.apk#MEXC-Trading-Bot-${TAG}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "MEXC Trading Bot Debug $TAG" \
              --notes "⚠️ **Debug APK for testing** — MEXC Trading Bot $TAG. This is a real working app connected to MEXC API. The only difference from release is it's not digitally signed."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
