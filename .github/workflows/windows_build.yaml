name: Windows Desktop Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Generate Windows platform files
        shell: pwsh
        run: flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Verify Windows Release
        shell: pwsh
        run: |
          $dir = "build\windows\x64\runner\Release"
          $exe = Join-Path $dir "Nor.exe"
          if (!(Test-Path $exe)) { throw "Windows executable was not produced: $exe" }
          if ((Get-Item $exe).Length -le 0) { throw "Windows executable is empty" }
          Write-Host "Executable: $exe"
          Get-ChildItem $dir | Format-Table Name,Length

      - name: Package Windows application
        shell: pwsh
        run: |
          $dir = "build\windows\x64\runner\Release"
          $zip = "Nor-Windows-x64.zip"
          Compress-Archive -Path "$dir\*" -DestinationPath $zip -Force
          if (!(Test-Path $zip)) { throw "Package was not created" }
          Write-Host "Package created: $zip"
          Get-Item $zip | Format-Table Name,Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: nor-windows-x64
          path: Nor-Windows-x64.zip
          if-no-files-found: error

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          $version = ($line -split ':',2)[1].Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Could not read version from pubspec.yaml" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create and publish Windows Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v${version}-windows-r${{ github.run_number }}"
          $repo = "${{ github.repository }}"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @{
            tag_name = $tag
            target_commitish = "main"
            name = "Nor Windows v$version (build ${{ github.run_number }})"
            body = "Verified Windows x64 desktop release for Windows 10/11."
            draft = $true
            prerelease = $false
          } | ConvertTo-Json
          $release = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$repo/releases" -Headers $headers -ContentType "application/json" -Body $body
          $uploadUrl = $release.upload_url -replace '\{\?name,label\}',''
          $file = (Resolve-Path "Nor-Windows-x64.zip").Path
          $uploadHeaders = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "Content-Type" = "application/zip"
          }
          Invoke-RestMethod -Method Post -Uri "$uploadUrl?name=Nor-Windows-x64.zip" -Headers $uploadHeaders -InFile $file
          Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/$repo/releases/$($release.id)" -Headers $headers -ContentType "application/json" -Body '{"draft":false}'
          Write-Host "Published Windows release: https://github.com/$repo/releases/tag/$tag"
