name: Production CI/CD Build & Multi-Platform Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  # =========================================================================
  # JOB 1: Web & Node.js Server Full Production Bundle
  # =========================================================================
  build-web-server:
    name: 🌐 Build Web SPA & Production Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci || npm install

      - name: 🔍 Strict TypeScript Compilation & Typecheck
        run: npx tsc --noEmit

      - name: 🏗️ Compile Web SPA & Bundled Server (dist/server.cjs)
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🛡️ Verify Production Build Artifacts Exist
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Fatal: dist/index.html was not generated!"
            exit 1
          fi
          if [ ! -f "dist/server.cjs" ]; then
            echo "❌ Fatal: dist/server.cjs was not generated!"
            exit 1
          fi
          echo "✅ Production artifacts verified successfully:"
          ls -la dist/

      - name: 📦 Package Full Standalone Server Archive
        run: |
          tar -czvf mexc-web-server-bundle.tar.gz dist/ package.json

      - name: 🚀 Upload Web & Server Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mexc-web-server-bundle
          path: mexc-web-server-bundle.tar.gz
          retention-days: 30

  # =========================================================================
  # JOB 2: Android Release Signed APK & AAB Bundle
  # =========================================================================
  build-android:
    name: 🤖 Build Android Release (APK & AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: 🐦 Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔑 Configure Android Keystore & Signing Properties
        env:
          KS_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          K_PASS: ${{ secrets.CM_KEY_PASSWORD }}
          K_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
        run: |
          mkdir -p android/app
          FALLBACK_PASS="mexcpass123"
          FALLBACK_ALIAS="nor_release"
          STORE_PASS="$FALLBACK_PASS"
          KEY_PASS="$FALLBACK_PASS"
          TARGET_ALIAS="$FALLBACK_ALIAS"
          KEYSTORE_VALID=0
          KEYSTORE_FILE="android/app/my-Albader-key.jks"

          if [ -n "$KS_BASE64" ]; then
            echo "🔑 Decoding provided Keystore secret..."
            printf '%s' "$KS_BASE64" | base64 -d > "$KEYSTORE_FILE" 2>/dev/null || true
            CLEAN_SECRET_PASS=$(printf "%s" "$KS_PASS" | tr -d "\r\n\t" | tr -cd "\040-\176")
            [ -z "$CLEAN_SECRET_PASS" ] && CLEAN_SECRET_PASS="$FALLBACK_PASS"

            if [ -f "$KEYSTORE_FILE" ] && keytool -list -keystore "$KEYSTORE_FILE" -storepass "$CLEAN_SECRET_PASS" > /tmp/ks_list.txt 2>&1; then
              STORE_PASS="$CLEAN_SECRET_PASS"
              KEY_PASS="$CLEAN_SECRET_PASS"
              CLEAN_SECRET_ALIAS=$(printf "%s" "$K_ALIAS" | tr -d "\r\n\t" | tr -cd "a-zA-Z0-9_-")
              if [ -n "$CLEAN_SECRET_ALIAS" ] && keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASS" -alias "$CLEAN_SECRET_ALIAS" > /dev/null 2>&1; then
                TARGET_ALIAS="$CLEAN_SECRET_ALIAS"
              fi
              KEYSTORE_VALID=1
            fi
          fi

          if [ "$KEYSTORE_VALID" -eq 0 ]; then
            echo "⚡ Generating fresh production-grade 2048-bit RSA release keystore..."
            rm -f "android/app/my-Albader-key.jks"
            keytool -genkeypair -v \
              -keystore "android/app/my-Albader-key.jks" \
              -alias "$TARGET_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=MEXCTrader, OU=TradingOps, O=MEXCEnterprise, L=Dubai, S=Dubai, C=AE"
          fi

          cp -f "android/app/my-Albader-key.jks" "android/app/upload-keystore.jks" || true
          cp -f "android/app/my-Albader-key.jks" "android/my-Albader-key.jks" || true

          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=my-Albader-key.jks\n" "$STORE_PASS" "$KEY_PASS" "$TARGET_ALIAS" > android/key.properties
          cp -f android/key.properties android/app/key.properties
          echo "✅ Keystore and key.properties configured successfully."

      - name: 📱 Compile Android Release Signed APK
        run: >-
          flutter build apk --release --no-tree-shake-icons
          --dart-define=BLOCKPIT_MEXC_API_KEY="${{ secrets.BLOCKPIT_MEXC_API_KEY || secrets.BLOCKPIT_API_KEY }}"
          --dart-define=BLOCKPIT_MEXC_SECRET_KEY="${{ secrets.BLOCKPIT_MEXC_SECRET_KEY || secrets.BLOCKPIT_SECRET_KEY }}"
          --dart-define=BOT_MEXC_API_KEY="${{ secrets.BOT_MEXC_API_KEY || secrets.BOT_API_KEY || secrets.MEXC_API_KEY || secrets.API_KEY }}"
          --dart-define=BOT_MEXC_SECRET_KEY="${{ secrets.BOT_MEXC_SECRET_KEY || secrets.BOT_SECRET_KEY || secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}"
          --dart-define=MEXC_ACCOUNT_TYPE="SUB_ACCOUNT"

      - name: 📦 Compile Android Release Signed App Bundle (AAB)
        run: >-
          flutter build appbundle --release --no-tree-shake-icons
          --dart-define=BLOCKPIT_MEXC_API_KEY="${{ secrets.BLOCKPIT_MEXC_API_KEY || secrets.BLOCKPIT_API_KEY }}"
          --dart-define=BLOCKPIT_MEXC_SECRET_KEY="${{ secrets.BLOCKPIT_MEXC_SECRET_KEY || secrets.BLOCKPIT_SECRET_KEY }}"
          --dart-define=BOT_MEXC_API_KEY="${{ secrets.BOT_MEXC_API_KEY || secrets.BOT_API_KEY || secrets.MEXC_API_KEY || secrets.API_KEY }}"
          --dart-define=BOT_MEXC_SECRET_KEY="${{ secrets.BOT_MEXC_SECRET_KEY || secrets.BOT_SECRET_KEY || secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}"
          --dart-define=MEXC_ACCOUNT_TYPE="SUB_ACCOUNT"

      - name: 🛡️ Verify Android APK and AAB Exist
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK build failed or artifact not found: $APK_PATH"
            exit 1
          fi
          if [ ! -f "$AAB_PATH" ]; then
            echo "❌ AAB build failed or artifact not found: $AAB_PATH"
            exit 1
          fi
          echo "✅ Android artifacts ready for release:"
          ls -lh "$APK_PATH" "$AAB_PATH"

      - name: 🚀 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-trader-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 🚀 Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-trader-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # =========================================================================
  # JOB 3: Windows Standalone .EXE & NSIS Installer Build
  # =========================================================================
  build-windows:
    name: 🪟 Build Windows Standalone (.EXE & Installer)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: ⚙️ Enable Windows Desktop Toolchain
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v

      - name: 📦 Install Flutter Dependencies
        shell: pwsh
        run: |
          flutter clean
          flutter pub get

      - name: 🏗️ Compile Windows Release Executable (.EXE)
        shell: pwsh
        env:
          BOT_MEXC_API_KEY: ${{ secrets.BOT_MEXC_API_KEY || secrets.MEXC_API_KEY || secrets.API_KEY }}
          BOT_MEXC_SECRET_KEY: ${{ secrets.BOT_MEXC_SECRET_KEY || secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}
          BLOCKPIT_MEXC_API_KEY: ${{ secrets.BLOCKPIT_MEXC_API_KEY || secrets.BLOCKPIT_API_KEY }}
          BLOCKPIT_MEXC_SECRET_KEY: ${{ secrets.BLOCKPIT_MEXC_SECRET_KEY || secrets.BLOCKPIT_SECRET_KEY }}
        run: |
          flutter build windows --release `
            --dart-define=BOT_MEXC_API_KEY="$env:BOT_MEXC_API_KEY" `
            --dart-define=BOT_MEXC_SECRET_KEY="$env:BOT_MEXC_SECRET_KEY" `
            --dart-define=BLOCKPIT_MEXC_API_KEY="$env:BLOCKPIT_MEXC_API_KEY" `
            --dart-define=BLOCKPIT_MEXC_SECRET_KEY="$env:BLOCKPIT_MEXC_SECRET_KEY" `
            --dart-define=MEXC_ACCOUNT_TYPE="SUB_ACCOUNT"

      - name: 🛡️ Verify Windows Executable & Package Portable Zip
        shell: pwsh
        run: |
          $buildDir = 'build\windows\x64\runner\Release'
          $expected = Join-Path $buildDir 'mexc_event_trader_app.exe'
          if (!(Test-Path $expected)) {
            Get-ChildItem -Recurse 'build\windows' | ForEach-Object { Write-Host $_.FullName }
            throw "Expected Windows executable not found at: $expected"
          }
          Copy-Item $expected (Join-Path $buildDir 'MEXC_Event_Trader.exe') -Force
          Compress-Archive -Path "$buildDir\*" -DestinationPath 'MEXC-Event-Trader-Windows-x64.zip' -Force
          Write-Host "✅ Standalone Windows Release packaged successfully."

      - name: 🚀 Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mexc-event-trader-windows-x64
          path: |
            build\windows\x64\runner\Release\MEXC_Event_Trader.exe
            MEXC-Event-Trader-Windows-x64.zip
          retention-days: 30

  # =========================================================================
  # JOB 4: Unified GitHub Release Publisher (Triggered on Main Push)
  # =========================================================================
  publish-release:
    name: 🚀 Publish Multi-Platform Release
    needs: [build-web-server, build-android, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: mexc-event-trader-release-apk
          path: release-assets/

      - name: 📥 Download Android AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: mexc-event-trader-release-aab
          path: release-assets/

      - name: 📥 Download Windows Zip Artifact
        uses: actions/download-artifact@v4
        with:
          name: mexc-event-trader-windows-x64
          path: release-assets/

      - name: 📥 Download Web Server Bundle Artifact
        uses: actions/download-artifact@v4
        with:
          name: mexc-web-server-bundle
          path: release-assets/

      - name: 📢 Create GitHub Production Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-v${{ github.run_number }}
          name: MEXC Event Futures Trading Platform v${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
