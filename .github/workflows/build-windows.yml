name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Create PyInstaller spec file
      run: |
        $spec = @"
        # -*- mode: python ; coding: utf-8 -*-

        block_cipher = None

        a = Analysis(
            ['src/main.py'],
            pathex=[],
            binaries=[],
            datas=[],
            hiddenimports=['kivy', 'requests', 'websocket', 'feedparser'],
            hookspath=[],
            runtime_hooks=[],
            excludedimports=[],
            win_no_prefer_redirects=False,
            win_private_assemblies=False,
            cipher=block_cipher,
            noarchive=False,
        )
        
        pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)
        
        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.zipfiles,
            a.datas,
            [],
            name='MEXCTradingBot',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=True,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=True,
            disable_windowed_traceback=False,
            target_arch=None,
            codesign_identity=None,
            entitlements_file=None,
        )
        "@
        $spec | Out-File -Encoding UTF8 MEXCTradingBot.spec

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile MEXCTradingBot.spec

    - name: Create installer with NSIS
      uses: joncloud/makensis-action@v4
      with:
        script-file: installer.nsi
      continue-on-error: true

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: mexc-trading-bot-windows
        path: dist/MEXCTradingBot.exe
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/MEXCTradingBot.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify on failure
      if: failure()
      run: |
        echo "::error::EXE build failed"
        exit 1
