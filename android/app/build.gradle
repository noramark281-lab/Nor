plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = file('key.properties')
}
if (keystorePropertiesFile.exists()) {
    try {
        keystorePropertiesFile.withReader('UTF-8') { reader ->
            keystoreProperties.load(reader)
        }
    } catch (Exception e) {
        println("Warning loading key.properties: " + e.message)
    }
}

android {
    namespace = "com.nor.mexc_event_trader"
    compileSdk = 35
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId = "com.nor.mexc_event_trader"
        minSdk = 24
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            def sPassword = keystoreProperties.getProperty('storePassword')?.trim()
            def kPassword = keystoreProperties.getProperty('keyPassword')?.trim()
            def kAlias = keystoreProperties.getProperty('keyAlias')?.trim()
            def sFile = keystoreProperties.getProperty('storeFile')?.trim()

            if (sPassword && kPassword && kAlias) {
                def candidateFiles = [
                    sFile ? file(sFile) : null,
                    sFile ? rootProject.file(sFile) : null,
                    file("release-upload.jks"),
                    rootProject.file("release-upload.jks"),
                    rootProject.file("app/release-upload.jks"),
                    file("my-Albader-key.jks"),
                    rootProject.file("my-Albader-key.jks"),
                    rootProject.file("app/my-Albader-key.jks"),
                    file("upload-keystore.jks"),
                    rootProject.file("upload-keystore.jks"),
                    rootProject.file("app/upload-keystore.jks")
                ].findAll { it != null && it.exists() }

                if (!candidateFiles.isEmpty()) {
                    keyAlias = kAlias
                    keyPassword = kPassword
                    storeFile = candidateFiles.first()
                    storePassword = sPassword
                }
            }
        }
    }

    buildTypes {
        release {
            signingConfig = (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
    }
}
