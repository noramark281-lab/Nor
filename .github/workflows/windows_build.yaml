name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'pubspec.yaml'
      - 'lib/**'
      - 'windows/**'
      - '.github/workflows/windows_build.yaml'

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write
    
    env:
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      CMAKE_GENERATOR_PLATFORM: "x64"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Setup Visual Studio C++ Build Tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows EXE
        run: flutter build windows --release --verbose --dart-define=MEXC_API_KEY="${{ secrets.MEXC_API_KEY || secrets.API_KEY }}" --dart-define=MEXC_SECRET_KEY="${{ secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}" --dart-define=MEXC_API_SECRET="${{ secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}" --dart-define=SERVER_IP="${{ secrets.SERVER_IP || secrets.HOST_IP }}"

      - name: Verify build output
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          Write-Host "Listing build directory contents:"
          if (Test-Path $buildDir) {
            Get-ChildItem $buildDir | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
          } else {
            Get-ChildItem -Recurse "build\windows" | ForEach-Object { Write-Host "  $($_.FullName)" }
          }
          $exe = Get-ChildItem -Path $buildDir -Filter "*.exe" | Select-Object -First 1
          if ($exe) {
            Write-Host "Found executable: $($exe.FullName)"
            if ($exe.Name -ne "Nor.exe") { Copy-Item $exe.FullName "$buildDir\Nor.exe" -Force }
          } else { Write-Host "No executable found in release folder!"; exit 1 }

      - name: Bundle MSVC runtime DLLs
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          $dlls = @("MSVCP140.dll", "VCRUNTIME140.dll", "VCRUNTIME140_1.dll")
          foreach ($dll in $dlls) {
            $systemPath = "C:\Windows\System32\$dll"
            if (Test-Path $systemPath) { Copy-Item $systemPath -Destination $buildDir -Force; Write-Host "Bundled: $dll" }
          }

      - name: Build Windows Installer (NSIS)
        shell: pwsh
        run: |
          if (Test-Path "windows\installer.nsi") {
            if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") { & "C:\Program Files (x86)\NSIS\makensis.exe" windows\installer.nsi }
            elseif (Test-Path "C:\Program Files\NSIS\makensis.exe") { & "C:\Program Files\NSIS\makensis.exe" windows\installer.nsi }
            else { Write-Host "NSIS not installed; skipping installer." }
          }

      - name: Package as ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Nor-Windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nor-Windows-x64
          path: |
            Nor-Windows-x64.zip
            Nor_Setup.exe
          if-no-files-found: warn
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: windows-v1.8.0-${{ github.run_number }}
          name: Nor Windows Build v1.8.0 (#${{ github.run_number }})
          files: |
            Nor_Setup.exe
            Nor-Windows-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Windows Flutter build workflow validated/triggered by ChatGPT on 2026-08-17
