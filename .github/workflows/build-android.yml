- name: Determine release tag
  id: tag
  run: echo "tag=${{ env.RELEASE_TAG }}" >> $GITHUB_OUTPUT

- name: Check if release exists
  id: check_release
  env:
    TAG: ${{ steps.tag.outputs.tag }}
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  run: |
    if gh release view "$TAG" >/dev/null 2>&1; then
      echo "exists=true" >> $GITHUB_OUTPUT
    else
      echo "exists=false" >> $GITHUB_OUTPUT
    fi

- name: Create release (only if not exists)
  if: steps.check_release.outputs.exists == 'false'
  uses: actions/create-release@v1
  with:
    tag_name: ${{ steps.tag.outputs.tag }}
    release_name: Release ${{ steps.tag.outputs.tag }}
    body: Release created by workflow
  env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

- name: Update release (optional — run when it exists)
  if: steps.check_release.outputs.exists == 'true'
  env:
    TAG: ${{ steps.tag.outputs.tag }}
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  run: |
    gh release edit "$TAG" --title "Release $TAG" --notes "Updated by CI"
    
