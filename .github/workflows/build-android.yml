name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Keystore Password'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci || npm install

      # ==========================================
      # خطوة ربط واستدعاء إعدادات Supabase
      # ==========================================
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.TOKEN_SUPABASE }}
        run: |
          supabase link --project-ref ${{ secrets.PROJECT_URL }}

      - name: Build Web Frontend Assets
        run: npm run build

      - name: Add and Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Debug - Check Keystore Exists
        run: |
          echo "=== Checking android/app directory ==="
          ls -la android/app/
          echo "=== Checking keystore file ==="
          ls -la android/app/upload-keystore.jks || echo "Keystore NOT FOUND"
          echo "=== Checking key.properties ==="
          cat android/key.properties || echo "key.properties NOT FOUND"

      - name: Create Key Properties
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD || github.event.inputs.keystore_password }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD || github.event.inputs.keystore_password }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
        run: |
          cat > android/key.properties << EOF
          storePassword=${CM_KEYSTORE_PASSWORD}
          keyPassword=${CM_KEY_PASSWORD}
          keyAlias=${CM_KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF
          echo "=== Created key.properties ==="
          cat android/key.properties

      - name: Debug - Verify Setup After Key Properties
        run: |
          echo "=== Verifying android/app directory after key.properties creation ==="
          ls -la android/app/
          echo "=== Verifying keystore ==="
          ls -la android/app/upload-keystore.jks || echo "Keystore NOT FOUND"

      - name: Build Android Signed Release APK
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD || github.event.inputs.keystore_password }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build-log.txt
          exit ${PIPESTATUS[0]}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build-log.txt
          retention-days: 1

      - name: Build Android Signed Release AAB
        if: success()
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD || github.event.inputs.keystore_password }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MEXC-Trading-Bot-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload AAB Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MEXC-Trading-Bot-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create or Update GitHub Release & Upload APK / AAB
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          APK="android/app/build/outputs/apk/release/app-release.apk#MEXC-Trading-Bot-${TAG}-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab#MEXC-Trading-Bot-${TAG}-release.aab"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading assets with clobber..."
            gh release upload "$TAG" "$APK" "$AAB" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$APK" "$AAB" \
              --title "MEXC Trading Bot Release $TAG" \
              --notes "🚀 **MEXC Trading Bot Android Release $TAG**

          ### 📱 روابط التحميل المباشرة
          - **ملف APK (تثبيت مباشر)**: \`MEXC-Trading-Bot-${TAG}-release.apk\`
          - **حزمة AAB (جوجل بلاي)**: \`MEXC-Trading-Bot-${TAG}-release.aab\`"
          fi
