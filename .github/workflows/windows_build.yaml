name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'pubspec.yaml'
      - 'lib/**'
      - 'windows/**'
      - '.github/workflows/windows_build.yaml'

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      CMAKE_GENERATOR_PLATFORM: "x64"
    steps:
      - name: Configure Git for Windows (Long Paths & Safe Directory)
        shell: pwsh
        run: |
          git config --system core.longpaths true
          git config --global core.longpaths true
          git config --global --add safe.directory "*"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify checked out commit
        shell: pwsh
        run: |
          Write-Host "Building commit: $env:GITHUB_SHA"
          git rev-parse HEAD
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw "Checkout SHA does not match workflow SHA" }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: false

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Setup Visual Studio C++ Build Tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows EXE
        run: flutter build windows --release --verbose --dart-define=MEXC_API_KEY="${{ secrets.MEXC_API_KEY || secrets.API_KEY }}" --dart-define=MEXC_SECRET_KEY="${{ secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}" --dart-define=MEXC_API_SECRET="${{ secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}" --dart-define=SERVER_IP="${{ secrets.SERVER_IP || secrets.HOST_IP }}"

      - name: Verify build output
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          if (!(Test-Path $buildDir)) { throw "Windows release directory was not created" }
          Get-ChildItem $buildDir | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
          $exe = Get-ChildItem -Path $buildDir -Filter "*.exe" | Select-Object -First 1
          if (!$exe) { throw "No Windows EXE found in release directory" }
          Write-Host "Found executable: $($exe.FullName)"
          if ($exe.Name -ne "Nor.exe") { Copy-Item $exe.FullName "$buildDir\Nor.exe" -Force }

      - name: Bundle MSVC runtime DLLs
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          $dlls = @("MSVCP140.dll", "VCRUNTIME140.dll", "VCRUNTIME140_1.dll")
          foreach ($dll in $dlls) {
            $systemPath = "C:\Windows\System32\$dll"
            if (Test-Path $systemPath) { Copy-Item $systemPath -Destination $buildDir -Force }
          }

      - name: Build Windows Installer (NSIS)
        shell: pwsh
        run: |
          if (Test-Path "windows\installer.nsi") {
            if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") { & "C:\Program Files (x86)\NSIS\makensis.exe" windows\installer.nsi }
            elseif (Test-Path "C:\Program Files\NSIS\makensis.exe") { & "C:\Program Files\NSIS\makensis.exe" windows\installer.nsi }
            else { makensis windows\installer.nsi }
          }

      - name: Package as ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Nor-Windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nor-Windows-x64
          path: |
            Nor-Windows-x64.zip
            Nor_Setup.exe
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: windows-v1.8.0-${{ github.run_number }}
          name: Nor Windows Build v1.8.0 (#${{ github.run_number }})
          files: |
            Nor_Setup.exe
            Nor-Windows-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
