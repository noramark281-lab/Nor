name: Build and Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: nor-build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # JOB 1: Web SPA & Node Server Build Verification
  # =========================================================================
  build-web:
    name: Build Web & Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Build Web SPA & Server
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nor-web-dist
          path: dist/
          retention-days: 14

  # =========================================================================
  # JOB 2: Flutter Android Signed APK & AAB
  # =========================================================================
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Setup Keystore & Signing
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.CM_KEYSTORE_PASSWORD }}
          K_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.CM_KEY_PASSWORD }}
          K_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.CM_KEY_ALIAS }}
        run: |
          mkdir -p android/app
          
          STORE_PASS="mexcpass123"
          KEY_PASS="mexcpass123"
          TARGET_ALIAS="nor_release"
          KEYSTORE_VALID=0
          KEYSTORE_FILE="android/app/release-upload.jks"

          if [ -n "$KS_BASE64" ]; then
            echo "Decoding provided Keystore secret..."
            printf '%s' "$KS_BASE64" | base64 --decode > "$KEYSTORE_FILE" 2>/dev/null || true
            
            CHECK_PASS="$KS_PASS"
            [ -z "$CHECK_PASS" ] && CHECK_PASS="mexcpass123"
            
            if [ -f "$KEYSTORE_FILE" ] && keytool -list -keystore "$KEYSTORE_FILE" -storepass "$CHECK_PASS" > /tmp/ks_list.txt 2>&1; then
              echo "Keystore verified successfully."
              STORE_PASS="$CHECK_PASS"
              KEY_PASS="${K_PASS:-$CHECK_PASS}"
              TARGET_ALIAS="${K_ALIAS:-nor_release}"
              KEYSTORE_VALID=1
            else
              echo "Custom Keystore password did not match or file was invalid. Generating fresh key..."
              rm -f "$KEYSTORE_FILE"
            fi
          fi

          if [ "$KEYSTORE_VALID" -eq 0 ]; then
            echo "Generating fresh release keystore..."
            rm -f "android/app/release-upload.jks" "android/app/my-Albader-key.jks" "android/app/upload-keystore.jks"
            keytool -genkeypair -v \
              -keystore "android/app/release-upload.jks" \
              -alias "$TARGET_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Nor, OU=Trading, O=NorLab, L=Dubai, S=Dubai, C=AE"
            KEYSTORE_FILE="android/app/release-upload.jks"
          fi

          cp -f "$KEYSTORE_FILE" android/app/release-upload.jks || true
          cp -f "$KEYSTORE_FILE" android/app/my-Albader-key.jks || true
          cp -f "$KEYSTORE_FILE" android/app/upload-keystore.jks || true
          cp -f "$KEYSTORE_FILE" android/release-upload.jks || true
          cp -f "$KEYSTORE_FILE" android/my-Albader-key.jks || true
          cp -f "$KEYSTORE_FILE" android/upload-keystore.jks || true

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$TARGET_ALIAS
          storeFile=release-upload.jks
          EOF
          cp -f android/key.properties android/app/key.properties
          echo "key.properties configured successfully."

      - name: Build signed APK (Split ABIs & Universal)
        run: |
          mkdir -p release-assets
          
          echo "Step 1: Building Split Per-ABI Release APKs (arm64-v8a for Android 15)..."
          flutter build apk --release --split-per-abi --no-tree-shake-icons
          
          VERSION=$(awk -F ': ' '/^version:/{print $2}' pubspec.yaml | cut -d '+' -f 1)
          [ -z "$VERSION" ] && VERSION="1.8.0"
          
          # Copy split APKs immediately
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release-assets/Nor-MEXC-Trader-v${VERSION}-arm64-v8a.apk"
            cp -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-assets/app-arm64-v8a-release.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
            cp -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release-assets/Nor-MEXC-Trader-v${VERSION}-armeabi-v7a.apk"
          fi

          echo "Step 2: Building Universal Release APK..."
          flutter build apk --release --no-tree-shake-icons
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp -f build/app/outputs/flutter-apk/app-release.apk "release-assets/Nor-MEXC-Trader-v${VERSION}-universal.apk"
            cp -f build/app/outputs/flutter-apk/app-release.apk release-assets/app-release.apk
          fi

      - name: Build signed AAB
        run: |
          echo "Step 3: Building Release App Bundle (AAB)..."
          flutter build appbundle --release --no-tree-shake-icons
          
          VERSION=$(awk -F ': ' '/^version:/{print $2}' pubspec.yaml | cut -d '+' -f 1)
          [ -z "$VERSION" ] && VERSION="1.8.0"
          
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            cp -f build/app/outputs/bundle/release/app-release.aab "release-assets/Nor-MEXC-Trader-v${VERSION}.aab"
            cp -f build/app/outputs/bundle/release/app-release.aab release-assets/app-release.aab
          fi

      - name: Prepare release assets
        id: prepare_assets
        run: |
          VERSION=$(awk -F ': ' '/^version:/{print $2}' pubspec.yaml | cut -d '+' -f 1)
          [ -z "$VERSION" ] && VERSION="1.8.0"
          BUILD_NUM="${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_num=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "Generated assets in release-assets/:"
          ls -lh release-assets/

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nor-MEXC-Trader-APK-Build-${{ github.run_number }}
          path: release-assets/*.apk
          retention-days: 60

      - name: Upload AAB build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nor-MEXC-Trader-AAB-Build-${{ github.run_number }}
          path: release-assets/*.aab
          retention-days: 60

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prepare_assets.outputs.version }}-build-${{ steps.prepare_assets.outputs.build_num }}
          name: Nor MEXC Event Trader v${{ steps.prepare_assets.outputs.version }} (Build #${{ steps.prepare_assets.outputs.build_num }})
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          body: |
            ## 🚀 Nor MEXC Event Trader v${{ steps.prepare_assets.outputs.version }} (Build #${{ steps.prepare_assets.outputs.build_num }})
            
            ### 📱 Android Installation Guide (دليل التثبيت):
            - **لهواتف Android 15 و 64-bit الحديثة (مثل K35):** حمل ملف `Nor-MEXC-Trader-v${{ steps.prepare_assets.outputs.version }}-arm64-v8a.apk` أو `Nor-MEXC-Trader-v${{ steps.prepare_assets.outputs.version }}-universal.apk`.
            - **تنبيه هام:** إذا كان لديك إصدار قديم مثبت على الهاتف، يرجى **إلغاء تثبيت النسخة القديمة أولاً** لتجنب تعارض الشهادات الرقمية.
            
            ### 📦 Release Assets (الملفات المرفقة):
            - `Nor-MEXC-Trader-v${{ steps.prepare_assets.outputs.version }}-arm64-v8a.apk` (موصى به لأجهزة Android 14/15)
            - `Nor-MEXC-Trader-v${{ steps.prepare_assets.outputs.version }}-universal.apk` (الحزمة الشاملة)
            - `Nor-MEXC-Trader-v${{ steps.prepare_assets.outputs.version }}.aab` (Google Play Bundle)
          fail_on_unmatched_files: false
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
