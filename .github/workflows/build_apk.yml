name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify API secrets exist
        run: |
          if [ -z "${{ secrets.MEXC_API_KEY }}" ] || [ -z "${{ secrets.MEXC_SECRET_KEY }}" ]; then
            echo "Error: MEXC API keys are missing in Repository Secrets!"
            exit 1
          fi

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=MEXC_API_KEY=${{ secrets.MEXC_API_KEY }} \
            --dart-define=MEXC_SECRET_KEY=${{ secrets.MEXC_SECRET_KEY }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: release-${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            Automatic Release generated by GitHub Actions.
            - Built with updated Flutter & Android SDK.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
