name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Frontend Assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.PROJECT_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.PUBLISHABLE_KEY }}
          VITE_MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          VITE_MEXC_SECRET_KEY: ${{ secrets.MEXC_SECRET_KEY }}

      - name: Safe Link Supabase Project
        continue-on-error: true
        run: |
          TOKEN="${{ secrets.TOKEN_SUPABASE }}"
          PROJECT="${{ secrets.PROJECT_URL }}"
          if [ -n "$TOKEN" ] && [ -n "$PROJECT" ]; then
            if [[ "$TOKEN" == sbp_* ]]; then
              echo "Valid Supabase Access Token detected (sbp_...). Linking project..."
              npx supabase link --project-ref "$PROJECT" || echo "Supabase link skipped/failed safely."
            else
              echo "Notice: TOKEN_SUPABASE does not start with 'sbp_'. Skipping Supabase CLI link step safely without failing build."
            fi
          else
            echo "Supabase credentials not configured for CLI link. Continuing build safely..."
          fi

      - name: Add and Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build Android Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEXC-Trading-Bot-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEXC-Trading-Bot-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create or Update GitHub Release & Upload APK / AAB
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          TAG="v1.0.${{ github.run_number }}"
          APK="android/app/build/outputs/apk/debug/app-debug.apk#MEXC-Trading-Bot-${TAG}-debug.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab#MEXC-Trading-Bot-${TAG}-release.aab"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading assets with clobber..."
            gh release upload "$TAG" "$APK" "$AAB" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$APK" "$AAB" \
              --title "MEXC Trading Bot Release $TAG" \
              --notes "🚀 **MEXC Trading Bot Android Release $TAG**

          ### 📱 روابط التحميل المباشرة
          - **ملف APK (تثبيت مباشر)**: \`MEXC-Trading-Bot-${TAG}-debug.apk\`
          - **حزمة AAB (جوجل بلاي)**: \`MEXC-Trading-Bot-${TAG}-release.aab\`"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

