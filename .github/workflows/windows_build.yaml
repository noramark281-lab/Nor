name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'pubspec.yaml'
      - 'lib/**'
      - '.github/workflows/windows_build.yaml'

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write
    
    env:
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      CMAKE_GENERATOR_PLATFORM: "x64"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Setup Visual Studio C++ Build Tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'

      - name: Verify Flutter installation
        run: |
          flutter --version
          flutter doctor -v

      - name: Generate Windows platform files
        shell: pwsh
        run: |
          # Flutter create rejects directory names with uppercase letters.
          # Solution: copy the entire project to a lowercase temp directory,
          # run flutter create there, then copy the generated windows/ back.
          $tempDir = "${{ runner.temp }}\nor_app"
          if (Test-Path $tempDir) { Remove-Item $tempDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          Copy-Item -Path "${{ github.workspace }}\*" -Destination $tempDir -Recurse -Force
          
          Push-Location $tempDir
          flutter create --platforms=windows --project-name=mexc_event_trader_app .
          Pop-Location
          
          # Copy the generated windows/ folder back
          Copy-Item -Path "$tempDir\windows" -Destination "${{ github.workspace }}\windows" -Recurse -Force
          
          Write-Host "Generated windows files:"
          Get-ChildItem -Path "${{ github.workspace }}\windows" -Recurse -Name

      - name: Set binary name to Nor
        shell: pwsh
        run: |
          # Replace default project name with "Nor" in CMake files
          $files = @(
            "windows\CMakeLists.txt",
            "windows\runner\CMakeLists.txt",
            "windows\flutter\CMakeLists.txt"
          )
          foreach ($f in $files) {
            if (Test-Path $f) {
              (Get-Content $f -Raw) -replace 'mexc_event_trader_app', 'Nor' | Set-Content $f -NoNewline
              Write-Host "Updated: $f"
            }
          }
          
          # Update the window title in main.cpp
          $mainCpp = "windows\runner\main.cpp"
          if (Test-Path $mainCpp) {
            $content = Get-Content $mainCpp -Raw
            # Find the window title string and replace it
            $content = $content -replace 'mexc_event_trader_app', 'Nor - MEXC Event Trader'
            Set-Content $mainCpp -Value $content -NoNewline
            Write-Host "Updated window title in main.cpp"
          }

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows EXE
        run: flutter build windows --release --dart-define=MEXC_API_KEY="${{ secrets.MEXC_API_KEY || secrets.API_KEY }}" --dart-define=MEXC_SECRET_KEY="${{ secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}" --dart-define=MEXC_API_SECRET="${{ secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}" --dart-define=SERVER_IP="${{ secrets.SERVER_IP || secrets.HOST_IP }}"

      - name: Verify build output
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          $exePath = "$buildDir\Nor.exe"
          
          if (Test-Path $exePath) {
            Write-Host "SUCCESS: Nor.exe found!"
            $fileInfo = Get-Item $exePath
            Write-Host "File size: $($fileInfo.Length) bytes"
          } else {
            Write-Host "ERROR: Nor.exe not found at expected path"
            Write-Host "Searching for any .exe in build directory:"
            Get-ChildItem -Recurse "build\windows" -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "  Found: $($_.FullName)"
            }
            Write-Host "Full build directory listing:"
            if (Test-Path $buildDir) {
              Get-ChildItem -Recurse $buildDir | ForEach-Object { Write-Host "  $($_.FullName)" }
            } else {
              Write-Host "  Release directory does not exist"
              Get-ChildItem -Recurse "build\windows" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
            }
            exit 1
          }

      - name: Bundle MSVC runtime DLLs
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          
          # These are the Visual C++ Redistributable DLLs that users need
          # to have installed. We bundle them so the app works without
          # requiring a separate VC++ Redist installation.
          $dlls = @(
            "MSVCP140.dll",
            "VCRUNTIME140.dll",
            "VCRUNTIME140_1.dll"
          )
          
          foreach ($dll in $dlls) {
            $systemPath = "C:\Windows\System32\$dll"
            if (Test-Path $systemPath) {
              Copy-Item $systemPath -Destination $buildDir -Force
              Write-Host "Bundled: $dll"
            } else {
              Write-Host "WARNING: $dll not found in System32 - searching VCToolsInstallDir"
              # Try to find it from the MSVC toolchain
              $vctools = [System.Environment]::GetEnvironmentVariable("VCToolsInstallDir")
              if ($vctools) {
                $altPath = Get-ChildItem -Path $vctools -Recurse -Filter $dll -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($altPath) {
                  Copy-Item $altPath.FullName -Destination $buildDir -Force
                  Write-Host "Bundled from VCTools: $dll"
                } else {
                  Write-Host "ERROR: Could not find $dll anywhere!"
                }
              } else {
                Write-Host "ERROR: VCToolsInstallDir not set, could not find $dll"
              }
            }
          }
          
          Write-Host ""
          Write-Host "Final Release directory contents:"
          Get-ChildItem $buildDir | ForEach-Object { Write-Host "  $($_.Name)  ($($_.Length) bytes)" }

      - name: Package as ZIP
        shell: pwsh
        run: |
          Copy-Item "build\windows\x64\runner\Release\Nor.exe" -Destination "Nor.exe" -Force
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "Nor-Windows-x64.zip" -Force
          Write-Host "ZIP created: Nor-Windows-x64.zip"
          $zipInfo = Get-Item "Nor-Windows-x64.zip"
          Write-Host "ZIP size: $($zipInfo.Length) bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nor-Windows-x64
          path: |
            Nor-Windows-x64.zip
            Nor.exe
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: windows-v1.8.0-${{ github.run_number }}
          name: Nor Windows Build v1.8.0 (#${{ github.run_number }})
          files: |
            Nor-Windows-x64.zip
            Nor.exe
          body: |
            🖥️ Nor - MEXC Event Trader (Windows x64 Desktop Application)
            
            📥 خيارات التحميل:
            1. Nor-Windows-x64.zip: الحزمة الكاملة جاهزة للتشغيل مع كافة ملفات DLL اللازمة (موصى بها).
            2. Nor.exe: الملف التنفيذي المباشر.
            
            متطلبات التشغيل:
            - نظام التشغيل: Windows 10 / Windows 11 (64-bit)
            - المعالج: Intel / AMD x64
            - الذاكرة: 4GB+ RAM
            - دعم اللمس المتعدد: 2-Point Touch مدعوم بالكامل
            ✅ يتضمن مكتبات MSVC اللازمة مسبقاً (MSVCP140.dll و VCRUNTIME140.dll)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
