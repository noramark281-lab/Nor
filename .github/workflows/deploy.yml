name: Automated Build & Deployment Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type (release, beta, nightly)'
        required: false
        default: 'release'
      notify_deployment:
        description: 'Output Detailed Deployment Logs'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read
  deployments: write
  statuses: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Build Web Applet & Client Application
  # -------------------------------------------------------------
  build-web:
    name: Build Web Applet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build
        env:
          VITE_MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          VITE_MEXC_SECRET_KEY: ${{ secrets.MEXC_SECRET_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}

      - name: Verify Web Build Artifacts
        run: |
          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            echo "✅ Web build successfully verified in dist/"
            ls -lh dist/
          else
            echo "❌ Web build failed - dist/ or dist/index.html not found!"
            exit 1
          fi

      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-artifact
          path: dist/
          retention-days: 14

  # -------------------------------------------------------------
  # Job 2: Build Flutter Mobile Android (APK & AAB)
  # -------------------------------------------------------------
  build-mobile:
    name: Build Flutter Android (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Configure Keystore & Signing
        env:
          KS_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.CM_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || secrets.CM_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          K_PASS: ${{ secrets.KEY_PASSWORD || secrets.CM_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS || secrets.CM_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p android/app
          
          # Determine alias and passwords with clean fallbacks
          STORE_PASS="${KS_PASS:-mexcpass123}"
          KEY_PASS="${K_PASS:-$STORE_PASS}"
          TARGET_ALIAS="${K_ALIAS:-nor_release}"
          
          KEYSTORE_VALID=0
          KEYSTORE_FILE="android/app/my-Albader-key.jks"

          # 1. If base64 secret exists, decode it
          if [ -n "$KS_BASE64" ]; then
            echo "🔑 Decoding provided GitHub Secret Keystore..."
            printf '%s' "$KS_BASE64" | base64 -d > "$KEYSTORE_FILE" 2>/dev/null || true
            
            # Check if storepass works and extract alias if needed
            if [ -f "$KEYSTORE_FILE" ] && keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASS" > /tmp/ks_list.txt 2>&1; then
              echo "✅ Keystore password verified successfully."
              if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASS" -alias "$TARGET_ALIAS" > /dev/null 2>&1; then
                DETECTED_ALIAS=$(grep -oE '^[a-zA-Z0-9_-]+, [A-Za-z]+ [0-9]+' /tmp/ks_list.txt | awk -F',' '{print $1}' | head -n 1)
                if [ -n "$DETECTED_ALIAS" ]; then
                  echo "ℹ️ Using auto-detected alias from keystore: $DETECTED_ALIAS"
                  TARGET_ALIAS="$DETECTED_ALIAS"
                fi
              fi
              KEYSTORE_VALID=1
            else
              echo "⚠️ Provided Keystore was invalid or password did not match. Generating a fresh verified key..."
            fi
          fi

          # 2. Check if a valid committed keystore already exists
          if [ "$KEYSTORE_VALID" -eq 0 ]; then
            for existing_ks in "android/app/my-Albader-key.jks" "android/app/upload-keystore.jks" "android/my-Albader-key.jks" "android/upload-keystore.jks"; do
              if [ -f "$existing_ks" ] && keytool -list -keystore "$existing_ks" -storepass "$STORE_PASS" > /tmp/ks_list.txt 2>&1; then
                KEYSTORE_FILE="$existing_ks"
                DETECTED_ALIAS=$(grep -oE '^[a-zA-Z0-9_-]+, [A-Za-z]+ [0-9]+' /tmp/ks_list.txt | awk -F',' '{print $1}' | head -n 1)
                if [ -n "$DETECTED_ALIAS" ]; then
                  TARGET_ALIAS="$DETECTED_ALIAS"
                fi
                KEYSTORE_VALID=1
                echo "✅ Found valid existing keystore at $existing_ks with alias $TARGET_ALIAS"
                break
              fi
            done
          fi

          # 3. Generate a guaranteed fresh valid keystore if needed
          if [ "$KEYSTORE_VALID" -eq 0 ]; then
            echo "⚡ Generating fresh verified release signing key ($TARGET_ALIAS)..."
            rm -f "android/app/my-Albader-key.jks" "android/app/upload-keystore.jks"
            keytool -genkeypair -v \
              -keystore "android/app/my-Albader-key.jks" \
              -alias "$TARGET_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Nor, OU=Trading, O=NorLab, L=Dubai, S=Dubai, C=AE"
            KEYSTORE_FILE="android/app/my-Albader-key.jks"
          fi

          # Synchronize keystore across all expected file paths
          cp -f "$KEYSTORE_FILE" android/app/my-Albader-key.jks
          cp -f "$KEYSTORE_FILE" android/app/upload-keystore.jks
          cp -f "$KEYSTORE_FILE" android/my-Albader-key.jks
          cp -f "$KEYSTORE_FILE" android/upload-keystore.jks

          # Write key.properties
          echo "storePassword=$STORE_PASS" > android/key.properties
          echo "keyPassword=$KEY_PASS" >> android/key.properties
          echo "keyAlias=$TARGET_ALIAS" >> android/key.properties
          echo "storeFile=my-Albader-key.jks" >> android/key.properties

          cp -f android/key.properties android/app/key.properties
          echo "✅ Keystore and key.properties configured successfully:"
          cat android/key.properties
          ls -la android/app/*.jks

      - name: Build Release APK
        run: >-
          flutter build apk --release --no-tree-shake-icons
          --dart-define=MEXC_API_KEY="${{ secrets.MEXC_API_KEY || secrets.API_KEY }}"
          --dart-define=MEXC_SECRET_KEY="${{ secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}"
          --dart-define=MEXC_API_SECRET="${{ secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}"
          --dart-define=SERVER_IP="${{ secrets.SERVER_IP || secrets.HOST_IP }}"
        timeout-minutes: 20

      - name: Build Release App Bundle (AAB)
        run: >-
          flutter build appbundle --release --no-tree-shake-icons
          --dart-define=MEXC_API_KEY="${{ secrets.MEXC_API_KEY || secrets.API_KEY }}"
          --dart-define=MEXC_SECRET_KEY="${{ secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}"
          --dart-define=MEXC_API_SECRET="${{ secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}"
          --dart-define=SERVER_IP="${{ secrets.SERVER_IP || secrets.HOST_IP }}"
        timeout-minutes: 20

      - name: Verify APK & AAB Artifacts
        id: verify_artifacts
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found at $APK_PATH"
            exit 1
          fi
          if [ ! -f "$AAB_PATH" ]; then
            echo "❌ AAB not found at $AAB_PATH"
            exit 1
          fi
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          AAB_SIZE=$(du -h "$AAB_PATH" | cut -f1)
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "aab_size=$AAB_SIZE" >> $GITHUB_OUTPUT
          echo "✅ Verified APK: $APK_SIZE"
          echo "✅ Verified AAB: $AAB_SIZE"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mexc-trader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mexc-trader-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # -------------------------------------------------------------
  # Job 3: Release, Deployment Logs & Status Verification
  # -------------------------------------------------------------
  deploy-and-verify:
    name: Deploy Release & Verify Status
    needs: [build-web, build-mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: mexc-trader-apk
          path: release-artifacts/

      - name: Download AAB Artifact
        uses: actions/download-artifact@v4
        with:
          name: mexc-trader-aab
          path: release-artifacts/

      - name: Create GitHub Draft Release, Upload Assets & Publish
        id: create_release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.8.0-deploy-${{ github.run_number }}"
          NAME="Nor - MEXC Trader Release v1.8.0 (#${{ github.run_number }})"
          APK_PATH="release-artifacts/app-release.apk"
          AAB_PATH="release-artifacts/app-release.aab"

          BODY="## 🚀 Nor - MEXC Trading & Event Contract Platform v1.8.0 (#${{ github.run_number }})

          ### 📦 Build & Release Summary
          - **Commit**: \`${{ github.sha }}\`
          - **Branch**: \`${{ github.ref_name }}\`
          - **Run Number**: \`#${{ github.run_number }}\`
          - **Status**: ✅ **SUCCESSFUL BUILD**

          ### 📱 Downloads
          - 📥 **APK (Direct Installation)**: [app-release.apk](https://github.com/${{ github.repository }}/releases/download/${TAG}/app-release.apk)
          - 📦 **AAB (Google Play Store)**: [app-release.aab](https://github.com/${{ github.repository }}/releases/download/${TAG}/app-release.aab)

          ### 🛡️ Features Included
          - Real-time MEXC Futures and Event Contract trading
          - Real wallet balance reading & automated trade execution
          - HMAC SHA-256 signed API security
          - Dedicated backend proxy integration via \`SERVER_IP\`"

          echo "Creating draft release with tag: $TAG..."
          RELEASE_JSON=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$NAME\",\"body\":$(echo "$BODY" | jq -sR .),\"draft\":true,\"prerelease\":false}")

          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id // empty')
          UPLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.upload_url // empty' | sed 's/{?name,label}//')

          if [ -z "$RELEASE_ID" ] || [ -z "$UPLOAD_URL" ]; then
            echo "❌ Failed to create draft release"
            echo "$RELEASE_JSON"
            exit 1
          fi

          echo "Uploading APK asset to draft release..."
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "${UPLOAD_URL}?name=app-release.apk" \
            --data-binary "@$APK_PATH"

          echo "Uploading AAB asset to draft release..."
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/octet-stream" \
            "${UPLOAD_URL}?name=app-release.aab" \
            --data-binary "@$AAB_PATH"

          echo "Publishing release (draft: false)..."
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -d '{"draft":false}'

          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "✅ Release published: https://github.com/${{ github.repository }}/releases/tag/$TAG"

      - name: Output Deployment Logs & Summary Table
        run: |
          RELEASE_TAG="v1.8.0-deploy-${{ github.run_number }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          APK_DOWNLOAD="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/app-release.apk"
          AAB_DOWNLOAD="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/app-release.aab"
          WORKFLOW_RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "============================================================"
          echo "🎯 DEPLOYMENT STATUS VERIFICATION LOGS"
          echo "============================================================"
          echo "Timestamp:        $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Repository:       ${{ github.repository }}"
          echo "Commit SHA:       ${{ github.sha }}"
          echo "Branch:           ${{ github.ref_name }}"
          echo "Workflow Run:     ${WORKFLOW_RUN_URL}"
          echo "Deployment Tag:   ${RELEASE_TAG}"
          echo "Release Page:     ${RELEASE_URL}"
          echo "Direct APK URL:   ${APK_DOWNLOAD}"
          echo "Direct AAB URL:   ${AAB_DOWNLOAD}"
          echo "Status:           DEPLOYED & READY FOR PRODUCTION"
          echo "============================================================"

          # Output to GitHub Step Summary
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          # 🚀 Deployment Status: SUCCESS

          | Property | Value |
          | :--- | :--- |
          | **Status** | 🟢 **Deployed & Verified** |
          | **Version Tag** | \`${RELEASE_TAG}\` |
          | **Repository** | \`${{ github.repository }}\` |
          | **Commit** | \`${{ github.sha }}\` |
          | **Release Page** | [View GitHub Release](${RELEASE_URL}) |
          | **Direct APK Download** | [Download APK](${APK_DOWNLOAD}) |
          | **Direct AAB Download** | [Download AAB](${AAB_DOWNLOAD}) |
          | **Workflow Logs** | [View Run #${{ github.run_number }}](${WORKFLOW_RUN_URL}) |
          EOF
