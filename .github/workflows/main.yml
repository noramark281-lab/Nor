name: Build Android APK for Nor MEXC Event Futures & Meditation

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Prepare Android Assets & Sync
        run: |
          npx cap sync android

      - name: Ensure Gradle Wrapper & Permissions
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew

      - name: Build Android Release & Debug APKs
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../output_apk
          cp app/build/outputs/apk/debug/app-debug.apk ../output_apk/Nor-EventFutures-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nor-EventFutures-Android.apk
          path: output_apk/Nor-EventFutures-Android.apk

      - name: Create GitHub Release with Direct APK Link
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Nor Event Futures Android APK Release #${{ github.run_number }}
          body: |
            🚀 **Nor MEXC Event Futures & Guided Meditation Android App**
            
            - Built with Capacitor & Android SDK
            - Direct APK file ready for installation on Android devices.
            
            📥 **Download:** Click `Nor-EventFutures-Android.apk` below under Assets to install.
          files: output_apk/Nor-EventFutures-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
