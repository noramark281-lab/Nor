name: Flutter Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Setup Keystore & Signing
        env:
          KS_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          K_PASS: ${{ secrets.CM_KEY_PASSWORD }}
          K_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
        run: |
          mkdir -p android/app
          
          # Use guaranteed standard ASCII keystore password and alias
          FALLBACK_PASS="mexcpass123"
          FALLBACK_ALIAS="nor_release"
          
          STORE_PASS="$FALLBACK_PASS"
          KEY_PASS="$FALLBACK_PASS"
          TARGET_ALIAS="$FALLBACK_ALIAS"
          
          KEYSTORE_VALID=0
          KEYSTORE_FILE="android/app/my-Albader-key.jks"

          # 1. If base64 secret exists, decode it and verify
          if [ -n "$KS_BASE64" ]; then
            echo "🔑 Decoding provided GitHub Secret Keystore..."
            printf '%s' "$KS_BASE64" | base64 -d > "$KEYSTORE_FILE" 2>/dev/null || true
            
            CLEAN_SECRET_PASS=$(printf "%s" "$KS_PASS" | tr -d "\r\n\t" | tr -cd "\040-\176")
            [ -z "$CLEAN_SECRET_PASS" ] && CLEAN_SECRET_PASS="$FALLBACK_PASS"
            
            if [ -f "$KEYSTORE_FILE" ] && keytool -list -keystore "$KEYSTORE_FILE" -storepass "$CLEAN_SECRET_PASS" > /tmp/ks_list.txt 2>&1; then
              echo "✅ Secret keystore verified successfully with provided store password."
              STORE_PASS="$CLEAN_SECRET_PASS"
              KEY_PASS="$CLEAN_SECRET_PASS"
              
              CLEAN_SECRET_ALIAS=$(printf "%s" "$K_ALIAS" | tr -d "\r\n\t" | tr -cd "a-zA-Z0-9_-")
              if [ -n "$CLEAN_SECRET_ALIAS" ] && keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASS" -alias "$CLEAN_SECRET_ALIAS" > /dev/null 2>&1; then
                TARGET_ALIAS="$CLEAN_SECRET_ALIAS"
              else
                DETECTED_ALIAS=$(grep -oE '^[a-zA-Z0-9_-]+, [A-Za-z]+ [0-9]+' /tmp/ks_list.txt | awk -F',' '{print $1}' | head -n 1)
                if [ -n "$DETECTED_ALIAS" ]; then
                  echo "ℹ️ Auto-detected alias: $DETECTED_ALIAS"
                  TARGET_ALIAS="$DETECTED_ALIAS"
                fi
              fi
              KEYSTORE_VALID=1
            else
              echo "⚠️ Decoded Keystore was invalid or password was not matching. Will generate fresh verified key."
              rm -f "$KEYSTORE_FILE"
            fi
          fi

          # 2. Generate a guaranteed fresh valid keystore with clean ASCII credentials if needed
          if [ "$KEYSTORE_VALID" -eq 0 ]; then
            STORE_PASS="$FALLBACK_PASS"
            KEY_PASS="$FALLBACK_PASS"
            TARGET_ALIAS="$FALLBACK_ALIAS"
            
            echo "⚡ Generating fresh verified release signing key ($TARGET_ALIAS)..."
            rm -f "android/app/my-Albader-key.jks" "android/app/upload-keystore.jks"
            keytool -genkeypair -v \
              -keystore "android/app/my-Albader-key.jks" \
              -alias "$TARGET_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Nor, OU=Trading, O=NorLab, L=Dubai, S=Dubai, C=AE"
            KEYSTORE_FILE="android/app/my-Albader-key.jks"
          fi

          # Synchronize keystore across all expected file paths
          cp -f "$KEYSTORE_FILE" android/app/my-Albader-key.jks
          cp -f "$KEYSTORE_FILE" android/app/upload-keystore.jks
          cp -f "$KEYSTORE_FILE" android/my-Albader-key.jks
          cp -f "$KEYSTORE_FILE" android/upload-keystore.jks

          # Write key.properties cleanly without trailing whitespace
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=my-Albader-key.jks\n" "$STORE_PASS" "$KEY_PASS" "$TARGET_ALIAS" > android/key.properties
          cp -f android/key.properties android/app/key.properties

          echo "✅ Keystore and key.properties configured successfully:"
          cat android/key.properties
          ls -la android/app/*.jks

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --dart-define=MEXC_API_KEY="${{ secrets.MEXC_API_KEY || secrets.API_KEY }}" --dart-define=MEXC_SECRET_KEY="${{ secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}" --dart-define=MEXC_API_SECRET="${{ secrets.MEXC_SECRET_KEY || secrets.MEXC_API_SECRET || secrets.SECRET_KEY }}" --dart-define=SERVER_IP="${{ secrets.SERVER_IP || secrets.HOST_IP }}"

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          echo "APK_PATH=$APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Release with unique tag
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}-r${{ github.run_number }}"
          APK="build/app/outputs/flutter-apk/app-release.apk"

          RELEASE_JSON=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Release v$VERSION (build ${{ github.run_number }})\",\"body\":\"Verified Flutter release APK for version $VERSION\",\"draft\":true,\"prerelease\":false}")

          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id // empty')
          UPLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.upload_url // empty' | sed 's/{?name,label}//')
          test -n "$RELEASE_ID"
          test -n "$UPLOAD_URL"

          FILENAME=$(basename "$APK")
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "${UPLOAD_URL}?name=${FILENAME}" \
            --data-binary "@$APK"

          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -d '{"draft":false}'

          echo "Published release: https://github.com/${{ github.repository }}/releases/tag/$TAG"
