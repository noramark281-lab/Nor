name: Flutter Build & Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Setup Keystore & Signing
        env:
          KS_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          K_PASS: ${{ secrets.CM_KEY_PASSWORD }}
          K_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
        run: |
          mkdir -p android/app
          FALLBACK_PASS="mexcpass123"
          FALLBACK_ALIAS="nor_release"
          STORE_PASS="$FALLBACK_PASS"
          KEY_PASS="$FALLBACK_PASS"
          TARGET_ALIAS="$FALLBACK_ALIAS"
          KEYSTORE_VALID=0
          KEYSTORE_FILE="android/app/my-Albader-key.jks"
          if [ -n "$KS_BASE64" ]; then
            printf '%s' "$KS_BASE64" | base64 -d > "$KEYSTORE_FILE" 2>/dev/null || true
            CLEAN_SECRET_PASS=$(printf "%s" "$KS_PASS" | tr -d "\r\n\t" | tr -cd "\040-\176")
            [ -z "$CLEAN_SECRET_PASS" ] && CLEAN_SECRET_PASS="$FALLBACK_PASS"
            if [ -f "$KEYSTORE_FILE" ] && keytool -list -keystore "$KEYSTORE_FILE" -storepass "$CLEAN_SECRET_PASS" > /tmp/ks_list.txt 2>&1; then
              STORE_PASS="$CLEAN_SECRET_PASS"
              KEY_PASS="$CLEAN_SECRET_PASS"
              CLEAN_SECRET_ALIAS=$(printf "%s" "$K_ALIAS" | tr -d "\r\n\t" | tr -cd "a-zA-Z0-9_-")
              if [ -n "$CLEAN_SECRET_ALIAS" ] && keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASS" -alias "$CLEAN_SECRET_ALIAS" > /dev/null 2>&1; then TARGET_ALIAS="$CLEAN_SECRET_ALIAS"; fi
              KEYSTORE_VALID=1
            else rm -f "$KEYSTORE_FILE"; fi
          fi
          if [ "$KEYSTORE_VALID" -eq 0 ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -alias "$TARGET_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PASS" -keypass "$KEY_PASS" -dname "CN=Nor, OU=Trading, O=NorLab, L=Dubai, S=Dubai, C=AE"
          fi
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=my-Albader-key.jks\n" "$STORE_PASS" "$KEY_PASS" "$TARGET_ALIAS" > android/key.properties

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify APK integrity
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee app-release.apk.sha256
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-manual
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            app-release.apk.sha256
          if-no-files-found: error
