name: Build Signed APK & AAB Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Keystore & Signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ]; then
            echo "✅ Using configured GitHub Secret Keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
          else
            echo "⚡ Generating release signing key..."
            keytool -genkey -v -keystore android/app/upload-keystore.jks -alias mexckey -keyalg RSA -keysize 2048 -validity 10000 -storepass mexcpass123 -keypass mexcpass123 -dname "CN=Nor Spot Trader, OU=Trading, O=NorLab, L=Dubai, S=Dubai, C=AE"
            cat > android/key.properties <<EOF
          storePassword=mexcpass123
          keyPassword=mexcpass123
          keyAlias=mexckey
          storeFile=upload-keystore.jks
          EOF
          fi
          ls -la android/app/upload-keystore.jks

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons
        timeout-minutes: 15

      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release --no-tree-shake-icons
        timeout-minutes: 15

      - name: Verify APK & AAB exist
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          test -f "$APK_PATH"
          test -f "$AAB_PATH"
          ls -lh "$APK_PATH" "$AAB_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mexc-spot-trader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mexc-spot-trader-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create GitHub Draft Release, Upload Assets & Publish
        id: create_release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-spot-v${{ github.run_number }}"
          NAME="Nor MEXC Spot Android Release #${{ github.run_number }}"
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          BODY="🚀 إصدار Nor MEXC Spot الحقيقي — Build #${{ github.run_number }}
          - ✅ MEXC Spot API V3
          - ✅ أوامر POST /api/v3/order الحقيقية، وليس Order Test
          - ✅ حجم الصفقة الثابت 1 USDT
          - ✅ مفاتيح API تُدخل محلياً ولا تُضمّن داخل APK
          - ✅ APK و AAB موقعان"

          RELEASE_JSON=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$NAME\",\"body\":$(echo "$BODY" | jq -sR .),\"draft\":true,\"prerelease\":false}")

          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id // empty')
          UPLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.upload_url // empty' | sed 's/{?name,label}//')
          test -n "$RELEASE_ID"
          test -n "$UPLOAD_URL"

          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "${UPLOAD_URL}?name=app-release.apk" \
            --data-binary "@$APK_PATH"

          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/octet-stream" \
            "${UPLOAD_URL}?name=app-release.aab" \
            --data-binary "@$AAB_PATH"

          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -d '{"draft":false}'

          echo "Published release: https://github.com/${{ github.repository }}/releases/tag/$TAG"
          echo "Direct APK: https://github.com/${{ github.repository }}/releases/download/$TAG/app-release.apk"
          echo "Direct AAB: https://github.com/${{ github.repository }}/releases/download/$TAG/app-release.aab"
